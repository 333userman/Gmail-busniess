
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#258be8">
<title>GMAIL STORE</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, Arial, sans-serif;
  color: white;
  background: linear-gradient(135deg, #a5e6ff, #3199ee, #1764c5);
  overflow: hidden;
}

.glow {
  position: fixed;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  background: #d8f6ff55;
  filter: blur(70px);
  top: -100px;
  right: -100px;
}

.card {
  position: relative;
  width: 90%;
  max-width: 390px;
  padding: 35px 25px;
  text-align: center;
  border-radius: 28px;
  background: rgba(255,255,255,.19);
  border: 1px solid #ffffff66;
  box-shadow: 0 20px 60px #07549b55;
  backdrop-filter: blur(20px);
}

.logo {
  width: 80px;
  height: 80px;
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 24px;
  background: white;
  font-size: 45px;
  box-shadow: 0 8px 25px #07549b33;
}

h1 {
  margin: 0;
  font-size: 29px;
  letter-spacing: 2px;
}

.description {
  margin: 14px 0 28px;
  color: #eaf7ff;
  font-size: 14px;
  line-height: 1.5;
}

.progress-bg {
  width: 100%;
  height: 12px;
  background: #ffffff55;
  border-radius: 20px;
  overflow: hidden;
}

.progress {
  height: 100%;
  width: 0%;
  background: #c7f5ff;
  border-radius: 20px;
  box-shadow: 0 0 15px #c7f5ff;
}

.status {
  margin-top: 18px;
  font-size: 14px;
}

.timer {
  margin-top: 8px;
  font-size: 12px;
  color: #d9f2ff;
}

.button {
  display: block;
  margin-top: 25px;
  padding: 15px;
  background: white;
  color: #1674ca;
  border-radius: 14px;
  text-decoration: none;
  font-weight: bold;
  transition: .2s;
  border: none;
  width: 100%;
  font-size: 15px;
  cursor: pointer;
}

.button:active {
  transform: scale(.97);
}

.footer {
  margin-top: 20px;
  color: #d9f2ff;
  font-size: 11px;
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="card">
  <div class="logo">📧</div>

  <h1>GMAIL STORE</h1>

  <p class="description">
    Подготавливаем переход в официальное приложение Gmail.
  </p>

  <div class="progress-bg">
    <div class="progress" id="progress"></div>
  </div>

  <div class="status" id="status">
    Подготовка перехода...
  </div>

  <div class="timer" id="timer">
    Осталось 5 секунд
  </div>

  <button class="button" onclick="openGmail()">
    Открыть Gmail →
  </button>

  <div class="footer">
    Безопасный переход в приложение Google Gmail
  </div>
</div>

<script>
const progress = document.getElementById("progress");
const timer = document.getElementById("timer");
const status = document.getElementById("status");

let elapsed = 0;
let redirected = false;

function openGmail() {
  if (redirected) return;
  redirected = true;

  status.textContent = "Открываем приложение Gmail...";
  timer.textContent = "Переход выполняется";

  // Попытка открыть установленное приложение Gmail
  window.location.href = "googlegmail://";
}

const interval = setInterval(() => {
  elapsed += 0.05;

  const percent = Math.min(elapsed / 5 * 100, 100);
  progress.style.width = percent + "%";

  const remaining = Math.max(0, Math.ceil(5 - elapsed));
  timer.textContent = "Осталось " + remaining + " сек.";

  if (elapsed >= 5) {
    clearInterval(interval);
    openGmail();
  }
}, 50);
</script>

</body>
</html>
