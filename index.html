
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#b9dcff">
<title>Wen0x — Gmail Store</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;
 font-family:-apple-system,Arial,sans-serif;
 color:#20466e;
 background:linear-gradient(145deg,#eaf6ff,#b9dcff,#e4f2ff);
}
header{
 padding:20px;
 text-align:center;
 font-size:27px;
 font-weight:900;
}
header span{color:#398edb}
section{
 min-height:90vh;
 padding:30px 20px;
 display:flex;
 align-items:center;
 justify-content:center;
}
.card{
 width:100%;
 max-width:440px;
 padding:25px;
 text-align:center;
 background:#ffffff80;
 border:1px solid white;
 border-radius:28px;
 box-shadow:0 15px 40px #477eaa20;
 backdrop-filter:blur(20px);
}
.character{
 width:100%;
 height:270px;
 object-fit:cover;
 border-radius:20px;
}
h1{font-size:35px;margin:20px 0 10px}
p{color:#6382a1;line-height:1.6}
.icon{font-size:55px;margin-bottom:15px}
.tag{
 display:inline-block;
 padding:10px 16px;
 background:#d9edff;
 border-radius:14px;
 font-weight:700;
 color:#347fbd;
}
.progress-bg{
 height:10px;
 background:#d6eaff;
 border-radius:20px;
 overflow:hidden;
 margin-top:22px;
}
.progress{
 height:100%;
 width:0;
 background:linear-gradient(90deg,#55a9ef,#8bdfff);
 transition:width .1s;
}
.status{font-size:13px;margin-top:15px}
button{
 border:0;
 background:#398edb;
 color:white;
 padding:14px 22px;
 border-radius:14px;
 font-weight:bold;
 cursor:pointer;
 margin-top:18px;
}
footer{text-align:center;padding:25px;font-size:12px;color:#7895af}
</style>
</head>

<body>

<header>Wen<span>0x</span></header>

<section id="first">
 <div class="card">
  <img class="character" src="anime.png" alt="Персонажи Wen0x">
  <h1>Wen0x</h1>
  <p>Добро пожаловать в наш цифровой магазин!</p>
  <div class="tag">✨ Автоматическая выдача</div>
 </div>
</section>

<section id="second">
 <div class="card">
  <div class="icon">💎</div>
  <h1>Быстро и удобно</h1>
  <p>Подготавливаем переход к официальному сервису Gmail.</p>
  <div class="tag">🔒 Безопасный вход Google</div>
 </div>
</section>

<section id="third">
 <div class="card">
  <div class="icon">📧</div>
  <h1>Gmail</h1>
  <p>Сейчас откроется официальная страница входа в почту Google.</p>
  <div class="progress-bg">
   <div class="progress" id="progress"></div>
  </div>
  <div class="status" id="status">Завершение перехода...</div>
  <button onclick="goGmail()">Перейти в Gmail →</button>
 </div>
</section>

<footer>Wen0x © 2026</footer>

<script>
const sections = [
 document.getElementById("second"),
 document.getElementById("third")
];

let index = 0;
let stopped = false;

function goGmail(){
 stopped = true;
 window.location.href =
 "https://accounts.google.com/ServiceLogin?service=mail&continue=https%3A%2F%2Fmail.google.com%2Fmail%2F";
}

// Автоматическая прокрутка каждые 3 секунды
const scrollTimer = setInterval(()=>{
 if(stopped) {
  clearInterval(scrollTimer);
  return;
 }

 if(index < sections.length){
  sections[index].scrollIntoView({
   behavior:"smooth",
   block:"start"
  });
  index++;
 }else{
  clearInterval(scrollTimer);
  startProgress();
 }
},3000);

function startProgress(){
 if(stopped)return;

 const bar=document.getElementById("progress");
 const status=document.getElementById("status");
 let value=0;

 const animation=setInterval(()=>{
  if(stopped){
   clearInterval(animation);
   return;
  }

  value+=10;
  bar.style.width=value+"%";

  if(value>=100){
   clearInterval(animation);
   status.textContent="Переход на Gmail...";
   goGmail();
  }
 },60);
}
</script>

</body>
</html>
