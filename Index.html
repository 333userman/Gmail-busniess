
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eaf6ff">
<title>Gmail Store</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:20px;
 display:flex;align-items:center;justify-content:center;
 background:linear-gradient(145deg,#eaf7ff,#cceaff,#f7fbff);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 color:#193d57
}
.card{
 width:100%;max-width:410px;padding:27px;
 background:white;border:1px solid #dceeff;
 border-radius:27px;
 box-shadow:0 15px 50px #4d9bd01c
}
.flag{color:#4289b8;font-size:13px;margin-bottom:22px}
.logo{font-size:36px;margin-bottom:15px}
h1{font-size:25px;margin:0 0 10px}
p{font-size:14px;color:#8299aa;line-height:1.5}
label{display:block;font-size:13px;font-weight:600;margin:22px 0 9px}
input{
 width:100%;height:53px;padding:0 14px;
 border:1px solid #d8e9f7;border-radius:14px;
 background:#f8fcff;font-size:16px;outline:none
}
input:focus{border-color:#48a5e3}
button{
 width:100%;height:49px;margin-top:13px;
 border:0;border-radius:14px;background:#399fe0;
 color:white;font-size:14px;font-weight:650
}
.status{margin-top:18px;padding:13px;border-radius:12px;
 background:#f2f8fd;font-size:13px;color:#65849b}
.footer{text-align:center;color:#a0b5c5;font-size:11px;margin-top:24px}
</style>
</head>
<body>
<main class="card">
 <div class="flag">🇷🇺 Русский аккаунт</div>
 <div class="logo">✉️</div>
 <h1>Получение товара</h1>
 <p>Введите код покупки для проверки доступа.</p>

 <label for="code">Код доступа</label>
 <input id="code" type="text" placeholder="Введите код"
        autocomplete="off" autocapitalize="characters">

 <button id="check">Проверить код</button>

 <div class="status" id="status">Проверяем состояние системы...</div>
 <div class="footer">GMAIL STORE · DELIVERY</div>
</main>

<script>
const statusBox = document.getElementById("status");

async function loadStatus(){
 try{
   const response = await fetch("./status.json?time=" + Date.now(), {
     cache:"no-store"
   });
   if(!response.ok) throw new Error("Status unavailable");

   const data = await response.json();

   statusBox.textContent = data.configured
     ? "Система настроена. Для проверки кода необходим защищённый сервер."
     : "Система пока не настроена.";
 }catch(error){
   statusBox.textContent = "Не удалось получить статус системы.";
 }
}

document.getElementById("check").addEventListener("click",()=>{
 const code = document.getElementById("code").value.trim();

 if(!code){
   statusBox.textContent = "Введите код доступа.";
   return;
 }

 statusBox.textContent =
   "Для проверки кода нужен серверный обработчик. Секреты GitHub недоступны напрямую из сайта.";
});

loadStatus();
</script>
</body>
</html>
